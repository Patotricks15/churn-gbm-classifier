[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-gbm-classifier"
version = "0.1.0"
description = "Tuned LightGBM churn classifier (CH02) on Olist Brazilian E-Commerce."
requires-python = ">=3.11"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
